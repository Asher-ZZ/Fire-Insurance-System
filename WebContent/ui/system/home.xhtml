<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">

	<ui:define name="content">
		<h:head>
			<style>
:root { -
	-primary: #3a86ff; -
	-secondary: #ff006e; -
	-accent: #8338ec; -
	-light: #f8f9fa; -
	-dark: #212529; -
	-gray: #6c757d; -
	-light-gray: #e9ecef;
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
	background-color: #f8f9fa;
	color: #333;
	line-height: 1.6;
}

.container {
	max-width: 1200px;
	margin: 0 auto;
	padding: 0 15px;
}

.hero-section {
	background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
		url('https://images.unsplash.com/photo-1537005081207-04f90e3ba640?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=1674&amp;q=80')
		no-repeat center center/cover;
	color: white;
	padding: 100px 0;
	text-align: center;
}

.hero-content {
	max-width: 800px;
	margin: 0 auto;
}

.hero-title {
	font-size: 3rem;
	font-weight: 700;
	margin-bottom: 20px;
	line-height: 1.2;
}

.hero-subtitle {
	font-size: 1.2rem;
	margin-bottom: 40px;
	opacity: 0.9;
}

.btn-hero {
	display: inline-block;
	background: var(- -primary);
	color: white;
	padding: 12px 30px;
	border-radius: 30px;
	text-decoration: none;
	font-weight: 600;
	margin-right: 15px;
	transition: all 0.3s ease;
}

.btn-hero:hover {
	background: #2a75ff;
	transform: translateY(-3px);
	box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
}

.btn-video {
	background: transparent;
	border: 2px solid white;
}

.btn-video:hover {
	background: rgba(255, 255, 255, 0.1);
}

.search-section {
	background: white;
	border-radius: 10px;
	padding: 30px;
	margin-top: -50px;
	box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
	position: relative;
	z-index: 10;
}

.search-grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
	gap: 20px;
	margin-bottom: 20px;
}

.search-item {
	margin-bottom: 15px;
}

.search-label {
	display: block;
	font-weight: 600;
	margin-bottom: 8px;
	color: var(- -dark);
}

.search-input {
	width: 100%;
	padding: 12px 15px;
	border: 1px solid var(- -light-gray);
	border-radius: 5px;
	font-size: 1rem;
}

.btn-search {
	background: var(- -primary);
	color: white;
	border: none;
	padding: 12px 30px;
	border-radius: 5px;
	font-weight: 600;
	cursor: pointer;
	width: 100%;
	transition: all 0.3s ease;
}

.btn-search:hover {
	background: #2a75ff;
}

.cars-section {
	padding: 80px 0;
}

.section-title {
	text-align: center;
	font-size: 2.5rem;
	margin-bottom: 50px;
	font-weight: 700;
	color: var(- -dark);
}

.cars-table {
    width: 100%;
    border-collapse: collapse;
}

.cars-table th, .cars-table td {
    padding: 10px;
    border-bottom: 1px solid #e9ecef;
    vertical-align: middle;
}

.car-table-image {
    width: 100px;
    height: 60px;
    object-fit: cover;
    border-radius: 5px;
}

.car-table-name {
    font-weight: 700;
    font-size: 1rem;
    display: block;
    margin-bottom: 5px;
}

.car-table-features {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 0.85rem;
    color: #6c757d;
}

.car-table-features li {
    display: flex;
    align-items: center;
    margin-bottom: 2px;
}

.car-table-features li i {
    margin-right: 5px;
    color: var(--primary);
}

.car-table-price {
    font-weight: 700;
    font-size: 1rem;
    color: var(--primary);
}

.btn-rent-table {
    background: var(--primary);
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-rent-table:hover {
    background: #2a75ff;
}

@media ( max-width :768px) {
	.hero-title {
		font-size: 2.2rem;
	}
	.search-grid {
		grid-template-columns: 1fr;
	}
	.btn-hero {
		display: block;
		margin: 10px auto;
		width: 80%;
	}
}
</style>
		</h:head>

		<h:body>
			<div class="container">
				<!-- Hero Section -->
				<div class="hero-section">
					<div class="hero-content">
						<h1 class="hero-title">ACCOMPANY YOUR JOURNEY WITH COMFORT</h1>
						<p class="hero-subtitle">Car rent services for various terrain
							with guaranteed quality</p>
						<a href="#" class="btn-hero">Learn More</a> <a href="#"
							class="btn-hero btn-video"><i class="fas fa-play-circle"></i>
							Watch Video</a>
					</div>
				</div>

				<!-- Search Section -->
				<div class="search-section">
					<h:form>
						<div class="search-grid">
							<div class="search-item">
								<label class="search-label">Location</label>

								<p:selectOneMenu id="branch" styleClass="search-input"
									value="#{ManageCarActionBean.car.carBranch}">
									<f:selectItems value="#{ManageCarActionBean.carBranches}"
										var="branch" itemLabel="#{branch}" itemValue="#{branch}" />
								</p:selectOneMenu>
							</div>

							<div class="search-item">
								<label class="search-label">Car Type</label>
								<p:selectOneMenu styleClass="search-input"
									value="#{ManageCarActionBean.selectedCarType}">
									<f:selectItem itemLabel="Any" itemValue="" />
									<f:selectItems value="#{ManageCarActionBean.carTypes}"
										var="type" itemLabel="#{type}" itemValue="#{type}" />
								</p:selectOneMenu>
							</div>

							<!-- <div class="search-item">
								<label class="search-label">Pick Up</label>
								<p:calendar styleClass="search-input"
									value="#{carRentalBean.pickupDate}" pattern="dd MMM yyyy" />
							</div>

							<div class="search-item">
								<label class="search-label">Return</label>
								<p:calendar styleClass="search-input"
									value="#{carRentalBean.returnDate}" pattern="dd MMM yyyy" />
							</div -->

							<div class="search-item">
								<label class="search-label" style="opacity: 0;">Search</label>
								<p:commandButton value="Search" styleClass="btn-search"
									action="#{ManageCarActionBean.searchCars}" update="carsSection" />

							</div>
						</div>
					</h:form>
				</div>
			</div>

			<!-- Cars Section -->
			<h:panelGroup id="carsSection">
    <h:dataTable value="#{ManageCarActionBean.carList}" var="car" styleClass="cars-table" border="0" cellpadding="10">
        <h:column>
            <h:graphicImage value="https://via.placeholder.com/100x60?text=Car" styleClass="car-table-image"/>
        </h:column>
        <h:column>
            <h:outputText value="#{car.type}" styleClass="car-table-name"/>
            <ul class="car-table-features">
                <li><i class="fas fa-user"></i> #{car.passenger} Seats</li>
                <li><i class="fas fa-gas-pump"></i> #{car.model}</li>
                <li><i class="fas fa-cog"></i> #{car.category}</li>
            </ul>
        </h:column>
        <h:column>
            <h:outputText value="$#{car.baseRate}/day" styleClass="car-table-price"/>
        </h:column>
        <h:column>
            <p:commandButton value="Rent Now" styleClass="btn-rent-table"/>
        </h:column>
    </h:dataTable>

    <h:panelGroup rendered="#{empty ManageCarActionBean.carList}">
        <p style="text-align: center; color: #6c757d; font-size: 1rem;">
            No cars available for selected criteria.
        </p>
    </h:panelGroup>
</h:panelGroup>


			<!-- PrimeFaces Scripts -->
			<h:outputScript library="primefaces" name="jquery/jquery.js" />
			<h:outputScript library="primefaces" name="primefaces.js" />
		</h:body>
	</ui:define>
</ui:composition>
