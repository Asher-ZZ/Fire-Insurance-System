<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">

	<ui:define name="content">
		<h:head>
			<style>
:root { -
	-primary: #3a86ff; -
	-secondary: #ff006e; -
	-accent: #8338ec; -
	-light: #f8f9fa; -
	-dark: #212529; -
	-gray: #6c757d; -
	-light-gray: #e9ecef;
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	background-color: #f8f9fa;
	color: #333;
	line-height: 1.6;
}

/* HERO */
.hero-section {
	background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
		url('https://images.unsplash.com/photo-1537005081207-04f90e3ba640?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=1674&amp;q=80')
		no-repeat center center/cover;
	color: white;
	padding: 50px 0;
	text-align: center;
}

.hero-title {
	font-size: 3rem;
	font-weight: 700;
	margin-bottom: 20px;
}

.hero-subtitle {
	font-size: 1.2rem;
	margin-bottom: 40px;
	opacity: 0.9;
}

.btn-hero {
	display: inline-block;
	background: var(- -primary);
	color: white;
	padding: 12px 30px;
	border-radius: 30px;
	text-decoration: none;
	font-weight: 600;
	margin: 5px;
	transition: all 0.3s ease;
}

.btn-hero:hover {
	background: #2a75ff;
	transform: translateY(-3px);
}

/* SEARCH */
.search-section {
	display: flex;
	justify-content: center;
	margin-top: -50px; /* pull card into hero */
	margin-bottom: 40px;
}

.search-panel {
	background: #fff;
	padding: 28px 36px 44px 33px;
	border-radius: 12px;
	box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
	display: flex;
	flex-wrap: wrap;
	gap: 20px;
	max-width: 1000px;
	align-items: flex-end;
}

.search-grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
	gap: 20px;
}

.search-label {
	font-weight: 600;
	margin-bottom: 8px;
	display: block;
}

.search-input {
	width: 100%;
	border: 1px solid var(- -light-gray);
	border-radius: 5px;
}

.btn-search {
	background: var(- -primary);
	color: white;
	border-radius: 5px;
	font-weight: 600;
	cursor: pointer;
	width: 100%;
	transition: all 0.3s ease;
}

.btn-search:hover {
	background: #2a75ff;
}

/* CAR LIST */
.cars-section {
	margin-bottom: 60px;
}

.section-title {
	text-align: center;
	font-size: 2.5rem;
	margin-bottom: 40px;
}

.car-card {
	background: white;
	border-radius: 10px;
	box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
	overflow: hidden;
	transition: all 0.3s ease;
}

.car-card:hover {
	transform: translateY(-5px);
}

.car-image {
	width: 100%;
	height: 160px;
	object-fit: cover;
}

.car-content {
	padding: 15px;
}

.car-title {
	font-size: 1.2rem;
	font-weight: bold;
	margin-bottom: 5px;
}

.car-features {
	font-size: 0.9rem;
	color: var(- -gray);
	margin-bottom: 10px;
}

.car-price {
	font-size: 1.1rem;
	font-weight: bold;
	color: var(- -primary);
}

.btn-rent {
	display: inline-block;
	background: var(- -primary);
	color: white;
	padding: 8px 15px;
	border-radius: 5px;
	font-size: 0.9rem;
	text-decoration: none;
	transition: all 0.3s ease;
}

.btn-rent:hover {
	background: #2a75ff;
}

.car-grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
	gap: 20px;
}
</style>
		</h:head>

		<h:body>
			<div class="container">
				<!-- Hero -->
				<div class="hero-section">
					<div class="hero-content">
						<h1 class="hero-title">ACCOMPANY YOUR JOURNEY WITH COMFORT</h1>
						<p class="hero-subtitle">Car rent services for various terrain
							with guaranteed quality</p>
					</div>
				</div>

				<!-- Search -->
				<div class="search-section">
					<h:form>
						<div class="search-panel"
							style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 20px;">

							<!-- Location -->
							<div class="search-item" style="flex: 1; min-width: 150px;">
							<p:message for="location" display="text" />
								<h:outputLabel for="location" value="Location:"
									styleClass="search-label" />
								<p:selectOneMenu id="location" styleClass="search-input" required="true" requiredMessage="Location is required"
									value="#{ManageCarActionBean.branch}">
									<f:selectItem itemLabel="Any" itemValue="" />
									<f:selectItems value="#{ManageCarActionBean.carBranches}"
										var="branch" itemLabel="#{branch}" itemValue="#{branch}" />
								</p:selectOneMenu>
							</div>

							<!-- Car Type -->
							<!-- <div class="search-item" style="flex: 1; min-width: 150px;">
								<h:outputLabel for="carType" value="Car Type:"
									styleClass="search-label" />
								<p:selectOneMenu id="carType" styleClass="search-input"
									value="#{ManageCarActionBean.selectedCarType}">
									<f:selectItem itemLabel="Any" itemValue="" />
									<f:selectItems value="#{ManageCarActionBean.carTypes}"
										var="type" itemLabel="#{type}" itemValue="#{type}" />
								</p:selectOneMenu>
							</div> -->

							<!-- Start Date -->
							<div class="search-item" style="flex: 1; min-width: 120px;">
							<p:message for="startDate" display="text" />
								<h:outputLabel for="startDate" value="Start Date:"
									styleClass="search-label" />
								<p:calendar id="startDate"
									value="#{ManageCarActionBean.startDate}"
									styleClass="search-input" pattern="yyyy-MM-dd" navigator="true"
									required="true" requiredMessage="Start date is required" />
							</div>


							<!-- End Date -->
							<div class="search-item" style="flex: 1; min-width: 150px;">
							<p:message for="endDate" display="text" />
								<h:outputLabel for="endDate" value="End Date:"
									styleClass="search-label" />
								<p:calendar id="endDate" value="#{ManageCarActionBean.endDate}"
									pattern="yyyy-MM-dd" navigator="true" styleClass="search-input"
									required="true" requiredMessage="End date is required" />
							</div>

							<!-- Search Button -->
							<div class="search-item" style="flex: 0 0 auto;">
								<p:commandButton id="searchBtn" value="Search"
									styleClass="btn-search"
									action="#{ManageCarActionBean.searchCars}"
									update=":carForm:carsSection @form" process="@form"  />
							</div>

						</div>

					</h:form>
				</div>
			</div>

			<!-- Cars -->
			<h:form id="carForm">
				<h:panelGroup id="carsSection" styleClass="ui-fluid">
					<div class="container cars-section">
						<h2 class="section-title">Available Cars</h2>
						<p:dataTable id="carsTable" paginator="true"
							value="#{ManageCarActionBean.availableCar}" var="car"
							emptyMessage="No cars available for selected criteria."
							styleClass="ui-datatable-gridlines" rowStyleClass="car-row">

							<p:column headerText="Type">
								<h:outputText value="#{car.type}" />
							</p:column>

							<p:column headerText="Make">
								<h:outputText value="#{car.make}" />
							</p:column>

							<!-- Model -->
							<p:column headerText="Model">
								<h:outputText value="#{car.model}" />
							</p:column>

							<!-- Year -->
							<p:column headerText="Year">
								<h:outputText value="#{car.year}" />
							</p:column>

							<p:column headerText="Rate">
								<h:outputText value="$#{car.baseRate}/day" />
							</p:column>
							<p:column headerText="Passenger">
								<h:outputText value="#{car.passenger}" />
							</p:column>

							<p:column headerText="Action">
								<p:commandButton value="Rent Now" styleClass="btn-rent"
									action="#{ManageCarActionBean.prepareRent(car)}" ajax="false" />
							</p:column>

						</p:dataTable>
					</div>
				</h:panelGroup>

			</h:form>
		</h:body>
	</ui:define>
</ui:composition>
