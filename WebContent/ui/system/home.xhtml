<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">

	<ui:define name="content">
		<h:head>
			<style>
:root { -
	-primary: #3a86ff; -
	-secondary: #ff006e; -
	-accent: #8338ec; -
	-light: #f8f9fa; -
	-dark: #212529; -
	-gray: #6c757d; -
	-light-gray: #e9ecef;
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
	background-color: #f8f9fa;
	color: #333;
	line-height: 1.6;
}

.container {
	max-width: 1200px;
	margin: 0 auto;
	padding: 0 15px;
}

/* HERO */
.hero-section {
	background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
		url('https://images.unsplash.com/photo-1537005081207-04f90e3ba640?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=1674&amp;q=80')
		no-repeat center center/cover;
	color: white;
	padding: 100px 0;
	text-align: center;
}

.hero-title {
	font-size: 3rem;
	font-weight: 700;
	margin-bottom: 20px;
}

.hero-subtitle {
	font-size: 1.2rem;
	margin-bottom: 40px;
	opacity: 0.9;
}

.btn-hero {
	display: inline-block;
	background: var(- -primary);
	color: white;
	padding: 12px 30px;
	border-radius: 30px;
	text-decoration: none;
	font-weight: 600;
	margin: 5px;
	transition: all 0.3s ease;
}

.btn-hero:hover {
	background: #2a75ff;
	transform: translateY(-3px);
}

/* SEARCH */
.search-section {
	background: white;
	border-radius: 10px;
	padding: 30px;
	margin-top: -50px;
	box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
	position: relative;
	z-index: 10;
}

.search-grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
	gap: 20px;
}

.search-label {
	font-weight: 600;
	margin-bottom: 8px;
	display: block;
}

.search-input {
	width: 100%;
	padding: 10px;
	border: 1px solid var(- -light-gray);
	border-radius: 5px;
}

.btn-search {
	background: var(- -primary);
	color: white;
	padding: 12px 20px;
	border-radius: 5px;
	font-weight: 600;
	cursor: pointer;
	width: 100%;
	transition: all 0.3s ease;
}

.btn-search:hover {
	background: #2a75ff;
}

/* CAR LIST */
.cars-section {
	padding: 60px 0;
}

.section-title {
	text-align: center;
	font-size: 2.5rem;
	margin-bottom: 40px;
}

.car-card {
	background: white;
	border-radius: 10px;
	box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
	overflow: hidden;
	transition: all 0.3s ease;
}

.car-card:hover {
	transform: translateY(-5px);
}

.car-image {
	width: 100%;
	height: 160px;
	object-fit: cover;
}

.car-content {
	padding: 15px;
}

.car-title {
	font-size: 1.2rem;
	font-weight: bold;
	margin-bottom: 5px;
}

.car-features {
	font-size: 0.9rem;
	color: var(- -gray);
	margin-bottom: 10px;
}

.car-price {
	font-size: 1.1rem;
	font-weight: bold;
	color: var(- -primary);
}

.btn-rent {
	display: inline-block;
	background: var(- -primary);
	color: white;
	padding: 8px 15px;
	border-radius: 5px;
	font-size: 0.9rem;
	text-decoration: none;
	transition: all 0.3s ease;
}

.btn-rent:hover {
	background: #2a75ff;
}

.car-grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
	gap: 20px;
}


</style>
		</h:head>

		<h:body>
			<div class="container">
				<!-- Hero -->
				<div class="hero-section">
					<div class="hero-content">
						<h1 class="hero-title">ACCOMPANY YOUR JOURNEY WITH COMFORT</h1>
						<p class="hero-subtitle">Car rent services for various terrain
							with guaranteed quality</p>
						<a href="#" class="btn-hero">Learn More</a> <a href="#"
							class="btn-hero">Watch Video</a>
					</div>
				</div>

				<!-- Search -->
				<div class="search-section">
					<h:form>
						<div class="search-grid">
							<div>
								<label class="search-label">Location</label>
								<p:selectOneMenu styleClass="search-input"
									value="#{ManageCarActionBean.car.carBranch}">
									<f:selectItems value="#{ManageCarActionBean.carBranches}"
										var="branch" itemLabel="#{branch}" itemValue="#{branch}" />
								</p:selectOneMenu>
							</div>
							<div>
								<label class="search-label">Car Type</label>
								<p:selectOneMenu styleClass="search-input"
									value="#{ManageCarActionBean.selectedCarType}">
									<f:selectItem itemLabel="Any" itemValue="" />
									<f:selectItems value="#{ManageCarActionBean.carTypes}"
										var="type" itemLabel="#{type}" itemValue="#{type}" />
								</p:selectOneMenu>
							</div>
							<div>
								<label class="search-label">Start Date</label>
								<p:calendar value="#{ManageCarActionBean.startDate}"
									pattern="dd-MM-yyyy" styleClass="search-input" />
							</div>
							<div>
								<label class="search-label">End Date</label>
								<p:calendar value="#{ManageCarActionBean.endDate}"
									pattern="dd-MM-yyyy" styleClass="search-input" />
							</div>
							<div>
								<label class="search-label" style="opacity: 0">Search</label>
								<p:commandButton value="Search" styleClass="btn-search"
									action="#{ManageCarActionBean.searchCars}" update="carsSection" />
							</div>
						</div>
					</h:form>
				</div>
			</div>

			<!-- Cars -->
			<h:panelGroup id="carsSection">
				<div class="container cars-section">
					<h2 class="section-title">Available Cars</h2>
					<div class="car-grid">
						<ui:repeat value="#{ManageCarActionBean.carList}" var="car">
							<div class="car-card">
								<!-- <h:graphicImage value="/resources/images/placeholder-car.png"
                style="width:100px; height:60px; object-fit:cover; border-radius:5px; opacity:0.7;"
                alt="No image available"/> -->
								<div class="car-content">
									<div class="car-title">#{car.type}</div>
									<div class="car-features">#{car.passenger} Seats •
										#{car.model} • #{car.category}</div>
									<div class="car-price">$#{car.baseRate}/day</div>
									<p:commandButton value="Rent Now" styleClass="btn-rent" />
								</div>
							</div>
						</ui:repeat>

						<h:panelGroup rendered="#{empty ManageCarActionBean.carList}">
							<p style="grid-column: 1/-1; text-align: center; color: #6c757d;">
								No cars available for selected criteria.</p>
						</h:panelGroup>
					</div>
				</div>
			</h:panelGroup>
		</h:body>
	</ui:define>
</ui:composition>
