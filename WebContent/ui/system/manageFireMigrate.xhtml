<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">
	<ui:param name="header" value="Fire Migrate Management System" />
	<ui:param name="headerRendered" value="true" />
	<ui:define name="content">
		<h:outputStylesheet library="css" name="custom-styles.css" />
		<h:head>
			<style>
.checkbox-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 8px 30px;
	margin-top: 10px;
}

.checkbox-grid .ui-selectbooleancheckbox {
	display: flex;
	align-items: center;
}

.checkbox-grid .ui-selectbooleancheckbox label {
	margin-left: 6px;
	font-size: 14px;
}

.ui-selectbooleancheckbox {
	display: flex;
	align-items: center;
	margin-bottom: 8px;
}

.ui-selectbooleancheckbox label {
	margin-left: 6px;
}
</style>
		</h:head>
		<h:form id="fireProposalEntry">
			<!-- 	<p:growl escape="false" globalOnly="true" life="5000"
				showDetail="true" /> -->
			<h:outputText value="Add New Fire Proposal" styleClass="title" />
			<p:wizard
				flowListener="#{ManageFireProposalActionBean.onFlowProcess}">
				<!-- Proposal Info Tab -->
				<p:tab id="proposalInfo" title="Proposal Info">
					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-6,ui-grid-col-6" layout="grid"
						styleClass="ui-panelgrid-blank ui-fluid">
						<!-- Left Section -->
						<p:panelGrid columns="2"
							columnClasses="ui-grid-col-3,ui-grid-col-9" layout="grid"
							styleClass="ui-panelgrid-blank ui-fluid">
							<p:outputLabel />
							<p:message for="customerTypeRadio" display="text" />
							<h:outputText value="Customer Type"
								styleClass="input-label mandatory" />
							<p:selectOneRadio id="customerTypeRadio"
								value="#{ManageFireProposalActionBean.fireProposal.customerType}"
								required="true" requiredMessage="Customer Type is required."
								layout="lineDirection">
								<f:selectItem itemLabel="Person" itemValue="Person" />
								<f:selectItem itemLabel="Organization" itemValue="Organization" />
								<p:ajax update="customerName" process="@this" />
							</p:selectOneRadio>

							<p:outputLabel />
							<p:message for="customerName" display="text" />
							<h:outputText value="Customer" styleClass="mandatory input-label" />
							<p:inputText id="customerName"
								value="#{ManageFireProposalActionBean.fireProposal.customer}"
								required="true" requiredMessage="Customer name is required."
								placeholder="#{ManageFireProposalActionBean.fireProposal.customerType eq 'Person' ? 'Select The Person' : (ManageFireProposalActionBean.fireProposal.customerType eq 'Organization' ? 'Select The Organization' : '')}" />

							<h:outputText value="Property Interest"
								styleClass="mandatory input-label" />
							<p:inputTextarea id="propertyInterest"
								value="#{ManageFireProposalActionBean.fireProposal.propertyInterest}"
								autoResize="true" rows="3" required="true"
								requiredMessage="Property interest is required." />

							<p:outputLabel />
							<p:message for="propertyLocation" display="text" />
							<h:outputText value="Property Location"
								styleClass="mandatory input-label" />
							<p:inputTextarea id="propertyLocation"
								value="#{ManageFireProposalActionBean.fireProposal.propertyLocation}"
								autoResize="true" rows="3" required="true"
								requiredMessage="Property location is required." />

							<p:outputLabel />
							<p:message for="township" display="text" />
							<h:outputText value="Township" styleClass="mandatory input-label" />
							<p:inputText id="township"
								value="#{ManageFireProposalActionBean.fireProposal.township}"
								required="true" requiredMessage="Township is required." />

							<p:outputLabel />
							<p:message id="policyNoMessage" for="policyNo" display="text" />
							<h:outputText value="Policy No."
								styleClass="input-label mandatory" />
							<p:inputText id="policyNo"
								value="#{ManageFireProposalActionBean.fireProposal.policyNumber}"
								required="true" requiredMessage="Policy No. is required."
								validator="#{ManageFireProposalActionBean.validatePolicyNo}">
								<p:ajax event="blur" update="policyNoMessage" />
							</p:inputText>
						</p:panelGrid>

						<!-- Right Section -->
						<p:panelGrid columns="2"
							columnClasses="ui-grid-col-3,ui-grid-col-9" layout="grid"
							styleClass="ui-panelgrid-blank ui-fluid">
							<p:outputLabel />
							<p:message for="saleChannel" display="text" />
							<h:outputText value="Sale Channel"
								styleClass="mandatory input-label" />
							<p:selectOneMenu id="saleChannel"
								value="#{ManageFireProposalActionBean.fireProposal.saleChannel}"
								required="true" requiredMessage="Sale channel is required.">
								<f:selectItem itemLabel="Select Sale Channel" itemValue=""
									noSelectionOption="true" />
								<f:selectItems
									value="#{ManageFireProposalActionBean.saleChannels}"
									var="channel" itemLabel="#{channel}" itemValue="#{channel}" />
							</p:selectOneMenu>

							<p:outputLabel />
							<p:message for="paymentType" display="text" />
							<h:outputText value="Payment Type"
								styleClass="mandatory input-label" />
							<p:selectOneMenu id="paymentType"
								value="#{ManageFireProposalActionBean.fireProposal.paymentType}"
								required="true" requiredMessage="Please select a payment type">
								<f:selectItem itemLabel="Select Payment Type" itemValue=""
									noSelectionOption="true" />
								<f:selectItems
									value="#{ManageFireProposalActionBean.availablePaymentTypes}"
									var="type" itemLabel="#{type.label}" itemValue="#{type}" />
								<p:ajax event="change"
									listener="#{ManageFireProposalActionBean.onPaymentTypeChange}"
									update="paymentType" process="@this" />
							</p:selectOneMenu>

							<!-- <p:outputLabel />
							<p:message for="branch" display="text" />
							<h:outputText value="Branch" styleClass="mandatory input-label" />
							<p:selectOneMenu id="branch"
								value="#{ManageFireProposalActionBean.fireProposal.branch}"
								required="true" requiredMessage="Branch is required.">
								<f:selectItem itemLabel="Select Branch" itemValue=""
									noSelectionOption="true" />
								<f:selectItems value="#{ManageFireProposalActionBean.branches}"
									var="branch" itemLabel="#{branch}" itemValue="#{branch}" />
							</p:selectOneMenu> -->
							<p:outputLabel />
							<p:message display="text" for="branchId" />
							<h:outputText styleClass="input-label" value="BRANCH" />
							<p:panelGrid styleClass="ui-panelgrid-blank"
								id="branchPanelGroup">
								<div style="margin-top: -5px; margin-left: -5px;"
									class="ui-g ui-fluid" id="branchPanelGroup">
									<div class="ui-inputgroup ui-g-12 ui-lg-12 ui-lg-12">
										<p:commandButton styleClass="green-button" icon="fa fa-search"
											actionListener="#{ManageFireProposalActionBean.selectBranch()}"
											id="selectBranchDialogLink" process="@this">
											<p:ajax event="dialogReturn"
												listener="#{ManageFireProposalActionBean.returnBranch}"
												update="branchId" />
										</p:commandButton>
										<p:inputText id="branchId"
											value="#{ManageFireProposalActionBean.fireProposal.branch == null ? '' : ManageFireProposalActionBean.fireProposal.branch.name}"
											readonly="true" />
										<p:commandButton styleClass="red-button" icon="fa fa-times"
											action="#{ManageFireProposalActionBean.fireProposal.setBranch(null)}"
											process="@this" update="branchId" />
									</div>
								</div>
							</p:panelGrid>

							<p:outputLabel />
							<p:message for="submitDate" display="text" />
							<h:outputText value="Submit Date"
								styleClass="mandatory input-label" />
							<p:calendar id="submitDate"
								value="#{ManageFireProposalActionBean.fireProposal.submittedDate}"
								pattern="dd-MM-yyyy" required="true"
								requiredMessage="Submit date is required." showOn="button" />

							<p:outputLabel />
							<p:message for="currency" display="text" />
							<h:outputText value="Currency Type"
								styleClass="mandatory input-label" />
							<p:selectOneMenu id="currency"
								value="#{ManageFireProposalActionBean.fireProposal.currencyType}"
								required="true" requiredMessage="Currency type is required.">
								<f:selectItem itemLabel="Select Currency Type" itemValue=""
									noSelectionOption="true" />
								<f:selectItems
									value="#{ManageFireProposalActionBean.currencyTypes}"
									var="currency" itemLabel="#{currency}" itemValue="#{currency}" />
							</p:selectOneMenu>

							<p:outputLabel />
							<p:message for="period" display="text" />
							<h:outputText value="Period of Insurance"
								styleClass="mandatory input-label" />
							<p:panelGrid columns="2" layout="grid"
								styleClass="ui-panelgrid-blank ui-fluid">
								<p:inputText id="period"
									value="#{ManageFireProposalActionBean.fireProposal.insurancePeriodDays}"
									required="true" requiredMessage="Insurance period is required."
									styleClass="spinner-input">
									<f:validateLongRange
										minimum="#{ManageFireProposalActionBean.periodMin}"
										maximum="#{ManageFireProposalActionBean.periodMax}" />
									<p:ajax event="change"
										listener="#{ManageFireProposalActionBean.updatePeriodRange}"
										update="paymentType" process="@this" />
								</p:inputText>

								<p:selectOneMenu id="periodUnit"
									value="#{ManageFireProposalActionBean.fireProposal.insurancePeriodUnit}"
									required="true" requiredMessage="Period unit is required."
									styleClass="period-unit-dropdown">
									<!-- <f:selectItem itemLabel="Select Period Unit"
										itemValue="Select Preiod Unit" noSelectionOption="true" /> -->
									<f:selectItem itemLabel="DAY" itemValue="DAY" />
									<f:selectItem itemLabel="MONTH" itemValue="MONTH" />
									<f:selectItem itemLabel="YEAR" itemValue="YEAR" />
									<p:ajax event="change"
										listener="#{ManageFireProposalActionBean.updatePeriodRange}"
										update="paymentType" process="@this" />
								</p:selectOneMenu>
							</p:panelGrid>

							<p:outputLabel />
							<p:message for="startDate" display="text" />
							<h:outputText value="Policy Start Date"
								styleClass="mandatory input-label" />
							<p:calendar id="startDate"
								value="#{ManageFireProposalActionBean.fireProposal.policyStartDate}"
								pattern="dd-MM-yyyy" required="true"
								requiredMessage="Start date is required." showOn="button" />
						</p:panelGrid>
					</p:panelGrid>

					<p:commandButton value="Cancel"
						action="#{ManageFireProposalActionBean.cancel}" immediate="true"
						style="margin-right: 5px;" />
				</p:tab>

				<!-- Building Info Tab -->
				<p:tab id="buildingInfo" title="Building Info">

					<h:form id="buildingForm">
						<!-- wrap everything in a form -->

						<!-- Global messages -->
						<!--    <p:messages id="message1" showDetail="true" autoUpdate="true" /> -->
						<p:panelGrid columns="2"
							columnClasses="ui-grid-col-6,ui-grid-col-6" layout="grid"
							styleClass="ui-panelgrid-blank ui-fluid">
							<p:panelGrid columns="2"
								columnClasses="ui-grid-col-3,ui-grid-col-9" layout="grid"
								styleClass="ui-panelgrid-blank ui-fluid">
								<p:outputLabel />
								<p:message display="text" for="buildingName" />
								<h:outputText value="Building Name"
									styleClass="input-label mandatory" />
								<p:inputText id="buildingName"
									value="#{ManageFireProposalActionBean.buildingInfo.buildingName}"
									required="true" requiredMessage="Building name is required." />


								<h:outputText value="Floor" styleClass="input-label" />
								<p:selectOneMenu id="floor"
									value="#{ManageFireProposalActionBean.buildingInfo.floor}"
									required="true" requiredMessage="Floor type is required.">
									<f:selectItem itemLabel="Select Floor Type" itemValue=""
										noSelectionOption="true" />
									<f:selectItems
										value="#{ManageFireProposalActionBean.floorTypes}" var="type"
										itemLabel="#{type}" itemValue="#{type}" />
								</p:selectOneMenu>
								<h:outputText value="Wall" styleClass="input-label" />
								<p:selectOneMenu id="wall"
									value="#{ManageFireProposalActionBean.buildingInfo.wall}"
									required="true" requiredMessage="Wall Type is required.">
									<f:selectItem itemLabel="-- Select Wall Type --"
										itemValue="#{null}" noSelectionOption="true" />
									<f:selectItems
										value="#{ManageFireProposalActionBean.wallTypes}" var="w"
										itemLabel="#{w}" itemValue="#{w}" />
								</p:selectOneMenu>
								<h:outputText value="Roofing" styleClass="input-label" />
								<p:selectOneMenu id="roofing"
									value="#{ManageFireProposalActionBean.buildingInfo.roofing}"
									required="true" requiredMessage="Roofing type is required.">
									<f:selectItem itemLabel="Select Roofing Type" itemValue=""
										noSelectionOption="true" />
									<f:selectItems
										value="#{ManageFireProposalActionBean.roofingTypes}"
										var="type" itemLabel="#{type}" itemValue="#{type}" />
								</p:selectOneMenu>
								<p:outputLabel />
								<p:message display="text" for="buildingClass" />
								<h:outputText value="Building Class"
									styleClass="mandatory input-label" />
								<p:selectOneMenu id="buildingClass"
									value="#{ManageFireProposalActionBean.buildingInfo.buildingClass}"
									required="true" requiredMessage="Building Class is required.">
									<f:selectItem itemLabel="Select Building Class" itemValue=""
										noSelectionOption="true" />
									<f:selectItems
										value="#{ManageFireProposalActionBean.buildingClasses}"
										var="cls" itemLabel="#{cls}" itemValue="#{cls}" />
								</p:selectOneMenu>
								<p:outputLabel />
								<p:message display="text" for="natureOfBusiness" />
								<h:outputText value="Nature of Business"
									styleClass="mandatory input-label" />
								<p:inputText id="natureOfBusiness"
									value="#{ManageFireProposalActionBean.buildingInfo.natureOfBusiness}"
									required="true"
									requiredMessage="Nature Of Business is required." />
							</p:panelGrid>
							<p:panelGrid columns="2"
								columnClasses="ui-grid-col-3,ui-grid-col-9" layout="grid"
								styleClass="ui-panelgrid-blank ui-fluid">
								<p:outputLabel />
								<p:message display="text" for="mainCover" />
								<h:outputText value="Main Cover"
									styleClass="mandatory input-label" />
								<p:inputText id="mainCover"
									value="#{ManageFireProposalActionBean.buildingInfo.mainCover}"
									required="true" requiredMessage="Main Cover is required" />
								<h:outputText value="Floor Name" styleClass="input-label" />
								<p:inputText id="floorName"
									value="#{ManageFireProposalActionBean.buildingInfo.floorName}" />
								<p:outputLabel />
								<p:message display="text" for="sumInsured" />
								<h:outputText value="Sum Insured"
									styleClass="mandatory input-label" />
								<p:inputText id="sumInsured"
									value="#{ManageFireProposalActionBean.buildingInfo.sumInsured}"
									required="true" requiredMessage="Sum Insured is required.">
									<f:convertNumber minFractionDigits="2" />
								</p:inputText>
								<h:outputText value="Length (ft)" styleClass="input-label" />
								<p:inputText id="length"
									value="#{ManageFireProposalActionBean.buildingInfo.length}" >
									<p:ajax event="keyup"
                        listener="#{ManageFireProposalActionBean.calculateSquareFeet}"
                        update="squareFeet" process="@this length" />
                        </p:inputText>
                        
								<h:outputText value="Width (ft)" styleClass="input-label" />
								<p:inputText id="width"
									value="#{ManageFireProposalActionBean.buildingInfo.width}" >
									<p:ajax event="keyup"
                        listener="#{ManageFireProposalActionBean.calculateSquareFeet}"
                        update="squareFeet" process="@this width" />
                        </p:inputText>
								<h:outputText value="Height (ft)" styleClass="input-label" />
								<p:inputText id="height"
									value="#{ManageFireProposalActionBean.buildingInfo.height}" />
								<p:outputLabel />
								<p:message display="text" for="squareFeet" />
								<h:outputText value="Square Feet"
									styleClass="mandatory input-label" />
								<p:inputText id="squareFeet"
									value="#{ManageFireProposalActionBean.buildingInfo.squareFeet}"
									required="true" readonly="true" requiredMessage="Square Feet is required" />
							</p:panelGrid>
						</p:panelGrid>
						<!-- Additional Cover -->
						<h:panelGrid columns="1"
							style="display: flex; justify-content: center;">
							<h:outputText value="Additional Cover" styleClass="section-title" />
							<h:panelGrid columns="2" cellpadding="8" style="margin-top: 8px;">
								<!-- Left Column -->
								<h:panelGroup layout="block">
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.airCraftDamage}"
										itemLabel="Air Craft Damage" />
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.earthQuakeFire}"
										itemLabel="EarthQuake Fire Earth Shock" />
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.floodAndInundation}"
										itemLabel="Flood And Inundation" />
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.impactDamage}"
										itemLabel="Impact Damage" />
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.riotStrike}"
										itemLabel="Riot, Strike And Malicious Damage" />
								</h:panelGroup>
								<!-- Right Column -->
								<h:panelGroup layout="block">
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.spontaneousCombustion}"
										itemLabel="Spontaneous Combustion" />
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.stormTyphoon}"
										itemLabel="Storm, Typhoon, Hurricane, Tempest, Cyclone-Others" />
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.waterDamage}"
										itemLabel="Water(B)" />
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.subsidenceAndLandslide}"
										itemLabel="Subsidence And Landslide" />
									<p:selectBooleanCheckbox
										value="#{ManageFireProposalActionBean.buildingInfo.warRisk}"
										itemLabel="War Risk" />
								</h:panelGroup>
							</h:panelGrid>
						</h:panelGrid>

						<!-- Add Button and Data Table -->
						<p:commandButton value="Add"
							action="#{ManageFireProposalActionBean.addBuilding}"
							process="buildingForm" update="buildingForm" icon="pi pi-plus"
							style="margin-right: 5px;" onstart="this.disabled=true;"
							oncomplete="this.disabled=false;" />

						<p:dataTable id="buildingTable"
							value="#{ManageFireProposalActionBean.buildings}" var="building"
							styleClass="ui-datatable">
							<p:column headerText="Building Name">
								<h:outputText value="#{building.buildingName}" />
							</p:column>
							<p:column headerText="Floor">
								<h:outputText value="#{building.floor}" />
							</p:column>
							<p:column headerText="Building Class">
								<h:outputText value="#{building.buildingClass}" />
							</p:column>
							<p:column headerText="Nature of Business">
								<h:outputText value="#{building.natureOfBusiness}" />
							</p:column>
							<p:column headerText="Sum Insured">
								<h:outputText value="#{building.sumInsured}">
									<f:convertNumber minFractionDigits="2" />
								</h:outputText>
							</p:column>
							<p:column headerText="Square Feet">
								<h:outputText value="#{building.squareFeet}" />
							</p:column>
						</p:dataTable>

						<p:commandButton value="Cancel" action="cancel"
							style="margin-right: 5px;" />
					</h:form>
				</p:tab>

				<!-- Premium Info Tab -->
				<p:tab id="premiumInfo" title="Premium Info"
					listener="#{ManageFireProposalActionBean.onTabChange}">
					<h:outputText value="Premium Details" styleClass="section-title" />

					<!-- Premium Data Table -->
					<p:dataTable id="premiumTable"
						value="#{ManageFireProposalActionBean.buildings}" var="building"
						rowIndexVar="rowIndex" styleClass="ui-datatable"
						emptyMessage="No buildings added yet.">
						<p:column headerText="No." style="width:50px; text-align:center;">
							<h:outputText value="#{rowIndex + 1}" />
						</p:column>

						<p:column headerText="Building Name">
							<h:outputText value="#{building.buildingName}" />
						</p:column>

						<p:column headerText="Sum Insured" style="text-align:right;">
							<h:outputText value="#{building.sumInsured}">
								<f:convertNumber minFractionDigits="2" />
							</h:outputText>
						</p:column>

						<!-- Editable Basic Premium -->
						<p:column headerText="Basic Premium (Period)"
							style="text-align:right;">
							<p:inputText value="#{building.basicPremiumPeriod}">
								<f:convertNumber minFractionDigits="2" />
								<p:ajax event="blur"
									listener="#{ManageFireProposalActionBean.recalculatePremiums}"
									update="@form" />
							</p:inputText>
						</p:column>

						<p:column headerText="Basic Premium (Term)"
							style="text-align:right;">
							<h:outputText value="#{building.basicPremiumTerm}">
								<f:convertNumber minFractionDigits="2" />
							</h:outputText>
						</p:column>

						<!-- Editable Add-On Premium -->
						<p:column headerText="Add-On Premium (Period)"
							style="text-align:right;">
							<p:inputText value="#{building.addOnPremiumPeriod}">
								<f:convertNumber minFractionDigits="2" />
								<p:ajax event="blur"
									listener="#{ManageFireProposalActionBean.recalculatePremiums}"
									update="@form" />
							</p:inputText>
						</p:column>

						<p:column headerText="Add-On Premium (Term)"
							style="text-align:right;">
							<h:outputText value="#{building.addOnPremiumTerm}">
								<f:convertNumber minFractionDigits="2" />
							</h:outputText>
						</p:column>

						<p:column headerText="Total Premium (Period)"
							style="text-align:right; font-weight:bold;">
							<h:outputText value="#{building.totalPremiumPeriod}">
								<f:convertNumber minFractionDigits="2" />
							</h:outputText>
						</p:column>

						<!-- 	<p:column headerText="Action"
							style="text-align:center; width:80px;">
							<p:commandButton value="Remove"
								action="#{ManageFireProposalActionBean.removeBuilding(building)}"
								update="@form" process="@this" icon="pi pi-trash" />
						</p:column> -->
					</p:dataTable>

					<!-- Total Premium Summary -->
					<!-- 		<p:panelGrid columns="2" styleClass="ui-fluid"
						style="margin-top: 10px;">
						<h:outputText value="Total Premium (Period): "
							styleClass="input-label" />
						<h:outputText id="totalPremiumOutput"
							value="#{ManageFireProposalActionBean.fireProposal.totalPremiumPeriod}">
							<f:convertNumber minFractionDigits="2" />
						</h:outputText>
					</p:panelGrid> -->

					<!-- Buttons -->
					<p:panelGrid columns="2" styleClass="ui-fluid"
						style="margin-top: 10px;">
						<p:commandButton value="Cancel"
							action="#{ManageFireProposalActionBean.cancel}" immediate="true"
							style="margin-right: 5px;" />
						<p:commandButton value="Save All"
							action="#{ManageFireProposalActionBean.saveAll}"
							update=":fireProposalEntry" process="@form"
