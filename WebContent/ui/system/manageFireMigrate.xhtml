<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/common/commonLayout.xhtml">
    <ui:param name="header" value="Fire Migrate Management System"/>
    <ui:param name="headerRendered" value="true"/>
    <ui:define name="content">
        <h:outputStylesheet library="css" name="custom-styles.css"/>
        <h:head>
            <style>
                .checkbox-grid {
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 8px 30px;
                    margin-top: 10px;
                }
                .checkbox-grid .ui-selectbooleancheckbox {
                    display: flex;
                    align-items: center;
                }
                .checkbox-grid .ui-selectbooleancheckbox label {
                    margin-left: 6px;
                    font-size: 14px;
                }
                .ui-selectbooleancheckbox {
                    display: flex;
                    align-items: center;
                    margin-bottom: 8px;
                }
                .ui-selectbooleancheckbox label {
                    margin-left: 6px;
                }
            </style>
        </h:head>
        <h:form id="fireProposalEntry">
            <p:growl escape="false" globalOnly="true" life="5000" showDetail="true"/>
            <h:outputText value="Add New Fire Proposal" styleClass="title"/>
            <p:wizard flowListener="#{ManageFireProposalActionBean.onFlowProcess}">
                <!-- Proposal Info Tab -->
                <p:tab id="proposalInfo" title="Proposal Info">
                    <p:panelGrid columns="2" columnClasses="ui-grid-col-6,ui-grid-col-6" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
                        <!-- Left Section -->
                        <p:panelGrid columns="2" columnClasses="ui-grid-col-3,ui-grid-col-9" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
                            <p:outputLabel />
                            <p:message display="text" for="customerTypeRadio" />
                            <h:outputText value="Customer Type" styleClass="input-label mandatory" />
                            <p:selectOneRadio id="customerTypeRadio" value="#{ManageFireProposalActionBean.fireProposal.customerType}" required="true" requiredMessage="Customer Type is required." layout="lineDirection">
                                <f:selectItem itemLabel="Person" itemValue="Person" />
                                <f:selectItem itemLabel="Organization" itemValue="Organization" />
                                <p:ajax update="customerName" process="@this" />
                            </p:selectOneRadio>
                            <p:outputLabel />
                            <p:message display="text" for="customerName" />
                            <h:outputText value="Customer" styleClass="mandatory input-label" />
                            <p:inputText id="customerName" value="#{ManageFireProposalActionBean.fireProposal.customer}" required="true" requiredMessage="Customer name is required."
                                         placeholder="#{ManageFireProposalActionBean.fireProposal.customerType eq 'Person' ? 'Select The Person' : (ManageFireProposalActionBean.fireProposal.customerType eq 'Organization' ? 'Select The Organization' : '')}" />
                            <h:outputText value="Property Interest" styleClass="mandatory input-label" />
                            <p:inputTextarea id="propertyInterest" value="#{ManageFireProposalActionBean.fireProposal.propertyInterest}" autoResize="true" rows="3" required="true" requiredMessage="Property interest is required." />
                            <p:outputLabel />
                            <p:message display="text" for="propertyLocation" />
                            <h:outputText value="Property Location" styleClass="mandatory input-label" />
                            <p:inputTextarea id="propertyLocation" value="#{ManageFireProposalActionBean.fireProposal.propertyLocation}" autoResize="true" rows="3" required="true" requiredMessage="Property location is required." />
                            <p:outputLabel />
                            <p:message display="text" for="township" />
                            <h:outputText value="Township" styleClass="mandatory input-label" />
                            <p:inputText id="township" value="#{ManageFireProposalActionBean.fireProposal.township}" required="true" requiredMessage="Township is required." />
                            <p:outputLabel />
                            <p:message display="text" for="policyNo" />
                            <h:outputText value="Policy No." styleClass="input-label mandatory" />
                            <p:inputText id="policyNo" value="#{ManageFireProposalActionBean.fireProposal.policyNumber}" required="true" />
                        </p:panelGrid>
                        <!-- Right Section -->
                        <p:panelGrid columns="2" columnClasses="ui-grid-col-3,ui-grid-col-9" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
                            <p:outputLabel />
                            <p:message display="text" for="saleChannel" />
                            <h:outputText value="Sale Channel" styleClass="mandatory input-label" />
                            <p:selectOneMenu id="saleChannel" value="#{ManageFireProposalActionBean.fireProposal.saleChannel}" required="true" requiredMessage="Sale channel is required.">
                                <f:selectItem itemLabel="Select Sale Channel" itemValue="" noSelectionOption="true"/>
                                <f:selectItems value="#{ManageFireProposalActionBean.saleChannels}" var="channel" itemLabel="#{channel}" itemValue="#{channel}"/>
                            </p:selectOneMenu>
                            <p:outputLabel />
                            <p:message display="text" for="paymentType" />
                            <h:outputText value="Payment Type" styleClass="mandatory input-label" />
                            <p:selectOneMenu id="paymentType" value="#{ManageFireProposalActionBean.fireProposal.paymentType}" required="true" requiredMessage="Please select a payment type">
                                <f:selectItem itemLabel="Select Payment Type" itemValue="" noSelectionOption="true"/>
                                <f:selectItems value="#{ManageFireProposalActionBean.paymentTypes}" var="type" itemLabel="#{type.label}" itemValue="#{type}"/>
                            </p:selectOneMenu>
                            <p:outputLabel />
                            <p:message display="text" for="branch" />
                            <h:outputText value="Branch" styleClass="mandatory input-label" />
                            <p:selectOneMenu id="branch" value="#{ManageFireProposalActionBean.fireProposal.branch}" required="true" requiredMessage="Branch is required.">
                                <f:selectItem itemLabel="Select Branch" itemValue="" noSelectionOption="true"/>
                                <f:selectItems value="#{ManageFireProposalActionBean.branches}" var="branch" itemLabel="#{branch}" itemValue="#{branch}"/>
                            </p:selectOneMenu>
                            <p:outputLabel />
                            <p:message display="text" for="submitDate" />
                            <h:outputText value="Submit Date" styleClass="mandatory input-label" />
                            <p:calendar id="submitDate" value="#{ManageFireProposalActionBean.fireProposal.submittedDate}" pattern="dd-MM-yyyy" required="true" requiredMessage="Submit date is required." showOn="button"/>
                            <p:outputLabel />
                            <p:message display="text" for="currency" />
                            <h:outputText value="Currency Type" styleClass="mandatory input-label" />
                            <p:selectOneMenu id="currency" value="#{ManageFireProposalActionBean.fireProposal.currencyType}" required="true" requiredMessage="Currency type is required.">
                                <f:selectItem itemLabel="Select Currency Type" itemValue="" noSelectionOption="true"/>
                                <f:selectItems value="#{ManageFireProposalActionBean.currencyTypes}" var="currency" itemLabel="#{currency}" itemValue="#{currency}"/>
                            </p:selectOneMenu>
                            <p:outputLabel />
                            <p:message display="text" for="period" />
                            <h:outputText value="Period of Insurance" styleClass="mandatory input-label" />
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
                                <p:inputText id="period" value="#{ManageFireProposalActionBean.fireProposal.insurancePeriodDays}" min="0" required="true" requiredMessage="Insurance period is required." styleClass="spinner-input"/>
                                <p:selectOneMenu id="periodUnit" value="#{ManageFireProposalActionBean.fireProposal.insurancePeriodUnit}" required="true" requiredMessage="Period unit is required.">
                                    <f:selectItem itemLabel="DAY" itemValue="DAY"/>
                                    <f:selectItem itemLabel="WEEK" itemValue="WEEK"/>
                                    <f:selectItem itemLabel="MONTH" itemValue="MONTH"/>
                                </p:selectOneMenu>
                            </p:panelGrid>
                            <p:outputLabel />
                            <p:message display="text" for="startDate" />
                            <h:outputText value="Policy Start Date" styleClass="mandatory input-label" />
                            <p:calendar id="startDate" value="#{ManageFireProposalActionBean.fireProposal.policyStartDate}" pattern="dd-MM-yyyy" required="true" requiredMessage="Start date is required." showOn="button"/>
                        </p:panelGrid>
                    </p:panelGrid>
    
                    <p:commandButton value="Cancel" action="cancel" style="margin-right: 5px;" />
              
                </p:tab>
                <!-- Building Info Tab -->
                <p:tab id="buildingInfo" title="Building Info">
                    <p:panelGrid columns="2" columnClasses="ui-grid-col-6,ui-grid-col-6" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
                        <p:panelGrid columns="2" columnClasses="ui-grid-col-3,ui-grid-col-9" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
                            <p:outputLabel />
                            <p:message display="text" for="buildingName" />
                            <h:outputText value="Building Name" styleClass="input-label mandatory" />
                            <p:inputText id="buildingName" value="#{ManageFireProposalActionBean.buildingInfo.buildingName}" required="true" requiredMessage="Building Name is required." />
                            <h:outputText value="Floor" styleClass="input-label" />
                            <p:inputText id="floor" value="#{ManageFireProposalActionBean.buildingInfo.floor}" />
                            <h:outputText value="Wall" styleClass="input-label" />
                            <p:selectOneMenu id="wall" value="#{ManageFireProposalActionBean.buildingInfo.wall}">
                                <f:selectItem itemLabel="Select" itemValue="" />
                                <f:selectItem itemLabel="Option 1" itemValue="Option1" />
                                <f:selectItem itemLabel="Option 2" itemValue="Option2" />
                            </p:selectOneMenu>
                            <h:outputText value="Roofing" styleClass="input-label" />
                            <p:selectOneMenu id="roofing" value="#{ManageFireProposalActionBean.buildingInfo.roofing}">
                                <f:selectItem itemLabel="Select" itemValue="" />
                                <f:selectItem itemLabel="Option 1" itemValue="Option1" />
                                <f:selectItem itemLabel="Option 2" itemValue="Option2" />
                            </p:selectOneMenu>
                            <p:outputLabel />
                            <p:message display="text" for="buildingClass" />
                            <h:outputText value="Building Class" styleClass="mandatory input-label" />
                            <p:inputText id="buildingClass" value="#{ManageFireProposalActionBean.buildingInfo.buildingClass}" required="true" requiredMessage="Building Class is required." />
                            <p:outputLabel />
                            <p:message display="text" for="natureOfBusiness" />
                            <h:outputText value="Nature of Business" styleClass="mandatory input-label" />
                            <p:inputText id="natureOfBusiness" value="#{ManageFireProposalActionBean.buildingInfo.natureOfBusiness}" required="true" requiredMessage="Nature Of Business is required." />
                        </p:panelGrid>
                        <p:panelGrid columns="2" columnClasses="ui-grid-col-3,ui-grid-col-9" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">
                            <p:outputLabel />
                            <p:message display="text" for="mainCover" />
                            <h:outputText value="Main Cover" styleClass="mandatory input-label" />
                            <p:inputText id="mainCover" value="#{ManageFireProposalActionBean.buildingInfo.mainCover}" required="true" requiredMessage="Main Cover is required" />
                            <h:outputText value="Floor Name" styleClass="input-label" />
                            <p:inputText id="floorName" value="#{ManageFireProposalActionBean.buildingInfo.floorName}" />
                            <p:outputLabel />
                            <p:message display="text" for="sumInsured" />
                            <h:outputText value="Sum Insured" styleClass="mandatory input-label" />
                            <p:inputText id="sumInsured" value="#{ManageFireProposalActionBean.buildingInfo.sumInsured}" required="true" requiredMessage="Sum Insured is required.">
                                <f:convertNumber minFractionDigits="2" />
                            </p:inputText>
                            <h:outputText value="Length (ft)" styleClass="input-label" />
                            <p:inputText id="length" value="#{ManageFireProposalActionBean.buildingInfo.length}" />
                            <h:outputText value="Width (ft)" styleClass="input-label" />
                            <p:inputText id="width" value="#{ManageFireProposalActionBean.buildingInfo.width}" />
                            <h:outputText value="Height (ft)" styleClass="input-label" />
                            <p:inputText id="height" value="#{ManageFireProposalActionBean.buildingInfo.height}" />
                            <p:outputLabel />
                            <p:message display="text" for="squareFeet" />
                            <h:outputText value="Square Feet" styleClass="mandatory input-label" />
                            <p:inputText id="squareFeet" value="#{ManageFireProposalActionBean.buildingInfo.squareFeet}" required="true" requiredMessage="Square Feet is required" />
                        </p:panelGrid>
                    </p:panelGrid>
                    <!-- Additional Cover -->
                    <h:panelGrid columns="1" style="display: flex; justify-content: center;">
                        <h:outputText value="Additional Cover" styleClass="section-title" />
                        <h:panelGrid columns="2" cellpadding="8" style="margin-top: 8px;">
                            <!-- Left Column -->
                            <h:panelGroup layout="block">
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.airCraftDamage}" itemLabel="Air Craft Damage" />
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.earthQuakeFire}" itemLabel="EarthQuake Fire Earth Shock" />
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.floodAndInundation}" itemLabel="Flood And Inundation" />
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.impactDamage}" itemLabel="Impact Damage" />
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.riotStrike}" itemLabel="Riot, Strike And Malicious Damage" />
                            </h:panelGroup>
                            <!-- Right Column -->
                            <h:panelGroup layout="block">
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.spontaneousCombustion}" itemLabel="Spontaneous Combustion" />
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.stormTyphoon}" itemLabel="Storm, Typhoon, Hurricane, Tempest, Cyclone-Others" />
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.waterDamage}" itemLabel="Water(B)" />
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.subsidenceAndLandslide}" itemLabel="Subsidence And Landslide" />
                                <p:selectBooleanCheckbox value="#{ManageFireProposalActionBean.buildingInfo.warRisk}" itemLabel="War Risk" />
                            </h:panelGroup>
                        </h:panelGrid>
                    </h:panelGrid>
                
                
                
                  
          
                 
                </p:tab>
                <!-- Premium Info Tab -->
                <p:tab id="premiumInfo" title="Premium Info">
                    <p:panelGrid columns="2" styleClass="ui-fluid">
                        <h:outputText value="Premium Details" styleClass="section-title"/>
                        <h:outputText value=""/>
                        <h:outputText value="Add New Premium"/>
                        <p:panelGrid columns="4" styleClass="ui-panelgrid-blank ui-fluid">
                            <p:inputNumber value="#{ManageFireProposalActionBean.newPremium.sumInsured}" required="true" requiredMessage="Sum insured is required." minFractionDigits="2"/>
                            <p:inputNumber value="#{ManageFireProposalActionBean.newPremium.premiumRate}" required="true" requiredMessage="Premium rate is required." minFractionDigits="2" maxFractionDigits="2"/>
                            <p:inputText value="#{ManageFireProposalActionBean.newPremium.buildingName}" placeholder="Building Name"/>
                            <p:commandButton value="Add" action="#{ManageFireProposalActionBean.addPremium}" update="premiumTable" process="@this"/>
                        </p:panelGrid>
                        <p:dataTable id="premiumTable" value="#{ManageFireProposalActionBean.premiumList}" var="premium">
                            <p:column headerText="Building Name">
                                <h:outputText value="#{premium.buildingName}"/>
                            </p:column>
                            <p:column headerText="Sum Insured">
                                <h:outputText value="#{premium.sumInsured}">
                                    <f:convertNumber minFractionDigits="2"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Premium Rate">
                                <h:outputText value="#{premium.premiumRate}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Total Premium">
                                <h:outputText value="#{premium.totalPremiumPeriod}">
                                    <f:convertNumber minFractionDigits="2"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Action">
                                <p:commandButton value="Remove" action="#{ManageFireProposalActionBean.removePremium(premium)}" update="premiumTable" process="@this"/>
                            </p:column>
                        </p:dataTable>
                        <h:outputText value="Total Sum Insured: "/>
                        <h:outputText value="#{ManageFireProposalActionBean.fireProposal.totalSumInsured}">
                            <f:convertNumber minFractionDigits="2"/>
                        </h:outputText>
                        <h:outputText value="Total Premium Period: "/>
                        <h:outputText value="#{ManageFireProposalActionBean.fireProposal.totalPremiumPeriod}">
                            <f:convertNumber minFractionDigits="2"/>
                        </h:outputText>
                    </p:panelGrid>
             
                    <p:commandButton value="Cancel" action="cancel" style="margin-right: 5px;" />
                    <p:commandButton value="Save" action="#{ManageFireProposalActionBean.saveAll}" style="float: right;" update=":fireProposalEntry" process="@form" styleClass="green-button"  />
        <p:commandButton value="Save" action="#{ManageFireProposalActionBean.saveAll}" style="float: right;" update=":fireProposalEntry" process="@form" styleClass="green-button"  />
     
                </p:tab>
            </p:wizard>
        </h:form>
    </ui:define>
</ui:composition>
