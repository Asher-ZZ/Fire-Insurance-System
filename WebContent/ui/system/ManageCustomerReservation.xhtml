<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">

	<ui:define name="content">
		<h:form id="rentalForm">
			<p:growl globalOnly="true" showDetail="true" escape="false" />

			<!-- Personal Information -->
			<p:panel header="Car Reservation Information" styleClass="ui-fluid">
				<p:panelGrid columns="2" columnClasses="ui-grid-col-6,ui-grid-col-6"
					layout="grid" styleClass="ui-panelgrid-blank">

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-4,ui-grid-col-8" layout="grid"
						styleClass="ui-panelgrid-blank ui-fluid">

						<p:outputLabel />
						<p:message display="text" for="renterId" />
						<h:outputText styleClass="mandatory input-label"
							value="Car Renter" />
						<p:panelGrid styleClass="ui-panelgrid-blank" id="renterPanelGroup">
							<div style="margin-top: -5px; margin-left: -5px;"
								class="ui-g ui-fluid" id="renterPanelGroup">
								<div class="ui-inputgroup ui-g-12 ui-lg-12 ui-lg-12">
									<p:commandButton styleClass="green-button" icon="fa fa-search"
										actionListener="#{ManageReservationActionBean.selectedRenter()}"
										id="selectrenterDialogLink" process="@this">
										<p:ajax event="dialogReturn"
											listener="#{ManageReservationActionBean.returnRenter}"
											update="renterId" />
									</p:commandButton>
									<p:inputText id="renterId"
										value="#{ManageReservationActionBean.reservation.renter== null ? '' : ManageReservationActionBean.reservation.renter.name}"
										readonly="true" />
									<p:commandButton styleClass="red-button" icon="fa fa-times"
										action="#{ManageReservationActionBean.reservation.setRenter(null)}"
										process="@this" update="renterId" />
								</div>
							</div>
						</p:panelGrid>

						<p:outputLabel />
						<p:message display="text" for="carId" />
						<h:outputText styleClass="mandatory input-label" value="Vehicle" />
						<p:panelGrid styleClass="ui-panelgrid-blank" id="carPanelGroup">
							<div style="margin-top: -5px; margin-left: -5px;"
								class="ui-g ui-fluid" id="carPanelGroup">
								<div class="ui-inputgroup ui-g-12 ui-lg-12 ui-lg-12">
									<p:commandButton styleClass="green-button" icon="fa fa-search"
										actionListener="#{ManageReservationActionBean.selectedCar()}"
										id="selectcarDialogLink" process="@this">
										<p:ajax event="dialogReturn"
											listener="#{ManageReservationActionBean.returnCar}"
											update="carId" />
									</p:commandButton>
									<p:inputText id="carId"
										value="#{ManageReservationActionBean.reservation.car == null ? '' : ManageReservationActionBean.reservation.car.type}"
										readonly="true" />
									<p:commandButton styleClass="red-button" icon="fa fa-times"
										action="#{ManageReservationActionBean.reservation.setCar(null)}"
										process="@this" update="carId" />
								</div>
							</div>
						</p:panelGrid>

						<p:outputLabel />
						<p:message for="startDate" display="text" />
						<h:outputText value="Start Date" />
						<p:calendar id="startDate"
							value="#{ManageReservationActionBean.reservation.startDate}"
							pattern="yyyy-MM-dd" showIcon="true" />

						<p:outputLabel />
						<p:message for="endDate" display="text" />
						<h:outputText value="End Date" />
						<p:calendar id="endDate"
							value="#{ManageReservationActionBean.reservation.endDate}"
							pattern="yyyy-MM-dd" showIcon="true" />
					</p:panelGrid>
				</p:panelGrid>

				<h:panelGrid columns="2" style="margin-top:15px;">
					<p:commandButton value="Add"
						action="#{ManageReservationActionBean.addReservation}"
						process="rentalForm reservationTable"
						update="rentalForm reservationTable" icon="pi pi-plus"
						style="margin-right: 5px;" onstart="this.disabled=true;"
						oncomplete="this.disabled=false;" />
				</h:panelGrid>

				<p:dataTable id="reservationTable"
					value="#{ManageReservationActionBean.reservationList}" var="r"
					style="margin-top:20px;" editable="true"
					emptyMessage="No reservations added yet.">

					<p:column headerText="Name">
						<h:outputText value="#{r.renter.name}" />
					</p:column>
					<p:column headerText="Email">
						<h:outputText value="#{r.renter.email}" />
					</p:column>
					<p:column headerText="Phone">
						<h:outputText value="#{r.renter.phoneNumber}" />
					</p:column>
					<p:column headerText="Car">
						<h:outputText value="#{r.car.type}" />
					</p:column>
					<p:column headerText="Base Rate">
						<h:outputText value="#{r.car.baseRate}" />
					</p:column>
					<p:column headerText="TOTAL COST">
						<h:outputText value="#{r.totalCost}" />
					</p:column>
					<p:column headerText="Start Date">
						<h:outputText value="#{r.startDate}">
							<f:convertDateTime pattern="yyyy-MM-dd" />
						</h:outputText>
					</p:column>
					<p:column headerText="End Date">
						<h:outputText value="#{r.endDate}">
							<f:convertDateTime pattern="yyyy-MM-dd" />
						</h:outputText>
					</p:column>
					<p:column headerText="Actions" style="width:150px;">

						<p:commandButton icon="fa fa-trash" title="Delete"
							actionListener="#{ManageReservationActionBean.deleteReservation(r)}"
							update="reservationTable" process="@this" />
					</p:column>
				</p:dataTable>
			</p:panel>
			<!-- Buttons -->
			<h:panelGrid columns="2" style="margin-top:15px;">
				<p:commandButton value="Submit" icon="pi pi-check"
					action="#{ManageReservationActionBean.saveReservations}"
					update=":rentalForm" style="margin-right:10px" />
				<p:commandButton value="Reset" icon="pi pi-refresh" type="reset"
					actionListener="#{ManageReservationActionBean.resetForm}"
					process="@this" update="@form" />
			</h:panelGrid>

			<p:dataTable var="r"
				value="#{ManageReservationActionBean.reserveList}" id="reserveTable"
				paginator="true" rows="10" style="width:100%"
				widgetVar="reserveTable"
				paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowsPerPageTemplate="5,10,15" rowKey="#{r.id}" reflow="true"
				rowIndexVar="var" paginatorPosition="bottom">

				<!-- Row Number -->
				<p:column headerText="No" width="2%">
					<h:outputText value="#{var + 1}" />
				</p:column>


				<!-- Car Type -->
				<p:column headerText="Customer Name" filterBy="#{r.renter.name}"
					filterMatchMode="contains">
					<h:outputText value="#{r.renter.name}" />
				</p:column>

				<!-- Car Make -->
				<p:column headerText="Email" filterBy="#{r.renter.email}"
					filterMatchMode="contains">
					<h:outputText value="#{r.renter.email}" />
				</p:column>

				<!-- Car Model -->
				<p:column headerText="Phone" filterBy="#{r.renter.phoneNumber}"
					filterMatchMode="contains">
					<h:outputText value="#{r.renter.phoneNumber}" />
				</p:column>

				<!-- Year -->
				<p:column headerText="Car" filterBy="#{r.car.type}"
					filterMatchMode="contains">
					<h:outputText value="#{r.car.type}" />
				</p:column>

				<p:column headerText="TOTAL COST" filterBy="#{r.totalCost}"
					filterMatchMode="contains">
					<h:outputText value="#{r.totalCost}" />
				</p:column>

				<!-- Status -->
				<p:column headerText="Start Date" filterBy="#{r.startDate}"
					filterMatchMode="contains">
					<h:outputText value="#{r.startDate}" />
				</p:column>

				<!-- Base Rate -->
				<p:column headerText="End Date" filterBy="#{r.endDate}"
					filterMatchMode="contains">
					<h:outputText value="#{r.endDate}" />
				</p:column>
				
				<!-- <p:column headerText="Status" filterBy="#{r.reserveStatus}"
					filterMatchMode="contains">
					<h:outputText value="#{r.reserveStatus}" />
				</p:column> -->

				<!-- Edit Button -->
				<!-- <p:column style="width:4%;">
					<p:commandButton styleClass="green-button" icon="fa fa-paint-brush"
						action="#{ManageCarActionBean.prepareUpdateCar(car)}"
						process="@this" update=":carEntryForm" />
				</p:column>
				 -->
				<p:column style="width:4%;">
					<p:commandButton styleClass="red-button" icon="fa fa-times"
						action="#{ManageReservationActionBean.deleteReservationFromDB(r)}"
						update=":rentalForm:reserveTable :rentalForm">
						<p:confirm header="Confirmation"
							message="Are you sure you want to delete this car?"
							icon="fa fa-exclamation-triangle" />
					</p:commandButton>
				</p:column>

			</p:dataTable>
		</h:form>
		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
	</ui:define>
</ui:composition>
