<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">

	<ui:define name="content">
		<h:form id="rentalForm">
			<p:growl globalOnly="true" showDetail="true" escape="false" />

			<!-- Personal Information -->
			<p:panel header="Personal Information" styleClass="ui-fluid">
				<p:panelGrid columns="2" columnClasses="ui-grid-col-6,ui-grid-col-6"
					layout="grid" styleClass="ui-panelgrid-blank">

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-4,ui-grid-col-8" layout="grid"
						styleClass="ui-panelgrid-blank ui-fluid">

						<p:outputLabel />
						<p:message for="name" display="text" />
						<h:outputText value="Name" styleClass="input-label mandatory" />
						<p:inputText id="name" value="#{rentalBean.name}" required="true"
							label="Name" />

						<p:outputLabel />
						<p:message for="email" display="text" />
						<h:outputText value="Email" />
						<p:inputText id="email" value="#{rentalBean.email}"
							required="true" label="Email">
							<f:validateRegex pattern="[^@]+@[^\\.]+\\..+" />
						</p:inputText>

						<p:outputLabel />
						<p:message for="phone" display="text" />
						<h:outputText value="Phone Number" />
						<p:inputText id="phone" value="#{rentalBean.phoneNumber}"
							required="true" label="Phone Number" />

						<p:outputLabel />
						<p:message for="license" display="text" />
						<h:outputText value="Driver Licence" />
						<p:inputText id="license" value="#{rentalBean.driverLicence}"
							required="true" label="Driver Licence" />

						<p:outputLabel />
						<p:message for="address" display="text" />
						<h:outputText value="Address" />
						<p:inputTextarea id="address" value="#{rentalBean.address}"
							rows="3" autoResize="true" required="true" label="Address" />
					</p:panelGrid>
					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-4,ui-grid-col-8" layout="grid"
						styleClass="ui-panelgrid-blank ui-fluid">
						<p:outputLabel />

						<p:message for="gender" display="text" />
						<h:outputText value="Gender" />
						<p:selectOneMenu id="gender"
							value="#{ManageReservationActionBean.renter.gender}"
							required="true">
							<f:selectItem itemLabel="Select" itemValue=""
								noSelectionOption="true" />
							<f:selectItems value="#{ManageReservationActionBean.genders}"
								var="g" itemLabel="#{g}" itemValue="#{g}" />
						</p:selectOneMenu>

						<p:outputLabel />
						<p:message for="idType" display="text" />
						<h:outputText value="ID Type" />
						<p:selectOneRadio id="idType"
							value="#{ManageReservationActionBean.renter.idType}"
							required="true" layout="lineDirection">
							<f:selectItem itemLabel="NRC" itemValue="NRC" />
							<f:selectItem itemLabel="Passport" itemValue="PASSPORT" />
							<p:ajax update="idPanel" process="@this" />
						</p:selectOneRadio>

						<h:panelGroup id="idPanel">
							<h:panelGrid columns="2"
								rendered="#{ManageReservationActionBean.renter.idType eq 'NRC'}"
								style="margin-top:10px;width:100%;">
								<p:selectOneMenu value="#{rentalBean.nrcState}">
									<f:selectItem itemLabel="- Select State -" itemValue="" />
									<f:selectItem itemLabel="1" itemValue="1" />
									<f:selectItem itemLabel="2" itemValue="2" />
									<f:selectItem itemLabel="3" itemValue="3" />
									<!-- add all 14 states/regions -->
								</p:selectOneMenu>

								<p:selectOneMenu value="#{rentalBean.nrcTownship}">
									<f:selectItem itemLabel="- Select Township -" itemValue="" />
									<f:selectItem itemLabel="Taunggyi" itemValue="TGI" />
									<f:selectItem itemLabel="Yangon" itemValue="YGN" />
									<!-- etc -->
								</p:selectOneMenu>

								<p:selectOneMenu value="#{rentalBean.nrcType}">
									<f:selectItem itemLabel="- Select Type -" itemValue="" />
									<f:selectItem itemLabel="(N)" itemValue="N" />
									<f:selectItem itemLabel="(P)" itemValue="P" />
								</p:selectOneMenu>

								<p:inputText value="#{rentalBean.nrcNumber}"
									placeholder="000000" maxlength="6" style="width:100%;" />
							</h:panelGrid>

							<h:panelGrid columns="2"
								rendered="#{ManageReservationActionBean.renter.idType eq 'PASSPORT'}"
								style="margin-top:10px;width:100%;">
								<h:outputText value="ID Number:" />
								<p:inputText
									value="#{ManageReservationActionBean.renter.idNumber}"
									style="width:100%" />
							</h:panelGrid>

						</h:panelGroup>



						<p:message for="dob" display="text" />
						<h:outputText value="Date of Birth" />
						<p:calendar id="dob" value="#{rentalBean.dateOfBirth}"
							pattern="yyyy-MM-dd" required="true" showIcon="true" />


						<p:outputLabel />
						 <p:message display="text" for="carId" />
						<h:outputText styleClass="mandatory input-label" value="Vehicle" />
						<p:panelGrid styleClass="ui-panelgrid-blank" id="carPanelGroup">
							<div style="margin-top: -5px; margin-left: -5px;"
								class="ui-g ui-fluid" id="carPanelGroup">
								<div class="ui-inputgroup ui-g-12 ui-lg-12 ui-lg-12">
									<p:commandButton styleClass="green-button" icon="fa fa-search"
										actionListener="#{ManageReservationActionBean.selectedCar()}"
										id="selectcarDialogLink" process="@this">
										<p:ajax event="dialogReturn"
											listener="#{ManageReservationActionBean.returnCar()}"
											update="carId" />
									</p:commandButton>
									<p:inputText id="carId"
										value="#{ManageReservationActionBean.selectedCar == null ? '' : ManageReservationActionBean.selectedCar.type}"
										readonly="true" />
									<p:commandButton styleClass="red-button" icon="fa fa-times"
										action="#{ManageReservationActionBean.setSelectedCar(null)}"
										process="@this" update="carId" />
								</div>
							</div>
						</p:panelGrid>

						<p:outputLabel />
						<p:message for="startDate" display="text" />
						<h:outputText value="Start Date" />
						<p:calendar id="startDate" value="#{rentalBean.startDate}"
							pattern="yyyy-MM-dd" required="true" showIcon="true" />

						<p:outputLabel />
						<p:message for="endDate" display="text" />
						<h:outputText value="End Date" />
						<p:calendar id="endDate" value="#{rentalBean.endDate}"
							pattern="yyyy-MM-dd" required="true" showIcon="true" />
					</p:panelGrid>
				</p:panelGrid>
			</p:panel>
			<!-- Buttons -->
			<h:panelGrid columns="2" style="margin-top:15px;">
				<p:commandButton value="Submit" icon="pi pi-check"
					action="#{rentalBean.submit}" update=":rentalForm"
					style="margin-right:10px" />
				<p:commandButton value="Reset" icon="pi pi-refresh" type="reset"
					process="@this" />
			</h:panelGrid>

		</h:form>
	</ui:define>
</ui:composition>
