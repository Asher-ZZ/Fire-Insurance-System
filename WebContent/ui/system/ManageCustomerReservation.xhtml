<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">

	<ui:define name="content">
		<h:form id="rentalForm">

        <h2>Personal Information</h2>
        <h:panelGrid columns="2" cellpadding="5">
            <h:outputLabel for="name" value="Name:" />
            <h:inputText id="name" value="#{rentalBean.name}" required="true" />

            <h:outputLabel for="email" value="Email:" />
            <h:inputText id="email" value="#{rentalBean.email}" required="true" >
                <f:validateRegex pattern="[^@]+@[^\.]+\..+" />
            </h:inputText>

            <h:outputLabel for="phone" value="Phone Number:" />
            <h:inputText id="phone" value="#{rentalBean.phoneNumber}" required="true" />

            <h:outputLabel for="license" value="Driver Licence:" />
            <h:inputText id="license" value="#{rentalBean.driverLicence}" required="true" />

            <h:outputLabel for="address" value="Address:" />
            <h:inputTextarea id="address" value="#{rentalBean.address}" rows="3" cols="30" required="true" />

            <h:outputLabel for="gender" value="Gender:" />
            <h:selectOneMenu id="gender" value="#{rentalBean.gender}" required="true">
                <f:selectItem itemLabel="Select" itemValue="" />
                <f:selectItem itemLabel="Male" itemValue="Male" />
                <f:selectItem itemLabel="Female" itemValue="Female" />
                <f:selectItem itemLabel="Other" itemValue="Other" />
            </h:selectOneMenu>

            <h:outputLabel for="idType" value="ID Type:" />
            <h:selectOneMenu id="idType" value="#{rentalBean.idType}" required="true">
                <f:selectItem itemLabel="Select" itemValue="" />
                <f:selectItem itemLabel="NRC" itemValue="NRC" />
                <f:selectItem itemLabel="Passport" itemValue="Passport" />
            </h:selectOneMenu>

            <h:outputLabel for="idNumber" value="ID Number:" />
            <h:inputText id="idNumber" value="#{rentalBean.idNumber}" required="true" />

            <h:outputLabel for="dob" value="Date of Birth:" />
            <h:inputText id="dob" value="#{rentalBean.dateOfBirth}" required="true">
                <f:convertDateTime pattern="yyyy-MM-dd"/>
            </h:inputText>
        </h:panelGrid>

        <h2>Vehicle Information</h2>
        <h:panelGrid columns="2" cellpadding="5">
            <h:outputLabel for="vehicleType" value="Vehicle Type:" />
            <h:selectOneMenu id="vehicleType" value="#{rentalBean.vehicleType}" required="true">
                <f:selectItem itemLabel="Select" itemValue="" />
                <f:selectItems value="#{rentalBean.availableVehicles}" var="car" 
                               itemLabel="#{car.make} #{car.model}" itemValue="#{car.carId}" />
            </h:selectOneMenu>

            <h:outputLabel for="startDate" value="Start Date:" />
            <h:inputText id="startDate" value="#{rentalBean.startDate}" required="true">
                <f:convertDateTime pattern="yyyy-MM-dd"/>
            </h:inputText>

            <h:outputLabel for="endDate" value="End Date:" />
            <h:inputText id="endDate" value="#{rentalBean.endDate}" required="true">
                <f:convertDateTime pattern="yyyy-MM-dd"/>
            </h:inputText>
        </h:panelGrid>

        <h:commandButton value="Submit" action="#{rentalBean.submit}" />
    </h:form>
		
		
		
	</ui:define>
</ui:composition>
